name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The project requires a very recent CMake, so take it from PyPI.
      - name: Install CMake and Ninja
        run: python -m pip install --upgrade cmake ninja

      - name: Install Linux dependencies (OpenSSL, libidn2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libidn2-dev pkg-config

      - name: Install macOS dependencies (OpenSSL, libidn2)
        if: runner.os == 'macOS'
        run: brew install openssl@3 libidn2 pkg-config

      - name: Configure
        working-directory: src/c
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix libidn2)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: src/c
        run: cmake --build build

      # Repeated because some tests are timing based; main exits non-zero on any failure.
      - name: Test
        working-directory: src/c/build
        shell: bash
        run: |
          for run in 1 2 3; do
            ./main || exit 1
          done
